name: npm CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the six npm packages after all target checks pass
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            binary: target/release/noesora
          - target: darwin-x64
            runner: macos-15-intel
            binary: target/release/noesora
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            binary: target/release/noesora
          - target: linux-x64
            runner: ubuntu-24.04
            binary: target/release/noesora
          - target: win32-x64
            runner: windows-2025
            binary: target/release/noesora.exe
    steps:
      - uses: actions/checkout@v4
        with:
          path: noesora-cli
      - uses: actions/checkout@v4
        with:
          repository: Noesora/noesora-engine
          ref: main
          token: ${{ secrets.ENGINE_REPO_READ_TOKEN }}
          path: noesora-engine
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: noesora-cli
      - name: Run Rust tests
        run: cargo test --locked
        working-directory: noesora-cli
      - name: Build native CLI
        run: cargo build --release --locked
        working-directory: noesora-cli
      - name: Prepare output directory
        run: mkdir -p "${{ runner.temp }}/noesora-npm"
        shell: bash
      - name: Pack meta-package
        run: npm pack --pack-destination "${{ runner.temp }}/noesora-npm" --json
        working-directory: noesora-cli
      - name: Prepare platform package
        id: native
        shell: bash
        working-directory: noesora-cli
        run: echo "stage=$(node scripts/prepare-npm-package.mjs --target '${{ matrix.target }}' --binary '${{ matrix.binary }}' --out '${{ runner.temp }}/noesora-npm')" >> "$GITHUB_OUTPUT"
      - name: Pack platform package
        run: npm pack "${{ steps.native.outputs.stage }}" --pack-destination "${{ runner.temp }}/noesora-npm" --json
        working-directory: noesora-cli
      - name: Install packed packages
        shell: bash
        working-directory: noesora-cli
        run: |
          version=$(node -p "require('./package.json').version")
          prefix="${{ runner.temp }}/noesora-install"
          npm install --prefix "$prefix" --no-save --ignore-scripts --omit=optional --no-audit --no-fund \
            "${{ runner.temp }}/noesora-npm/noesora-$version.tgz" \
            "${{ runner.temp }}/noesora-npm/noesora-bin-${{ matrix.target }}-$version.tgz"
          node scripts/assert-npm-install.mjs "$prefix" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: noesora-npm-${{ matrix.target }}
          path: ${{ runner.temp }}/noesora-npm/noesora-bin-${{ matrix.target }}-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          path: noesora-cli
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: noesora-cli/dist/npm
          merge-multiple: true
      - name: Pack meta-package
        run: npm pack --pack-destination dist/npm --json
        working-directory: noesora-cli
      - name: Publish platform packages, then meta-package
        shell: bash
        run: |
          for package in dist/npm/noesora-bin-*.tgz; do
            npm publish "$package" --access public --ignore-scripts
          done
          version=$(node -p "require('./package.json').version")
          npm publish "dist/npm/noesora-$version.tgz" --access public --ignore-scripts
        working-directory: noesora-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
