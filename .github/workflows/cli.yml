name: Public source checks
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Format public source
        run: rustfmt --edition 2021 --check src/main.rs tests/cli.rs tests/mcp.rs
      - name: Check smoke-driver syntax
        run: node --check scripts/smoke.mjs
      - name: Test current-frame TUI evidence transitions
        run: python3 -m unittest discover -s tests -p 'test_tui_smoke.py' -v
      - name: State public behavior boundary
        run: echo "This public gate tests the evidence-pane transition checker, but does not build or run the CLI. Full native behavior and cached-model checks require the private Trusted CLI workflow at this exact CLI SHA and its full Engine pin."
