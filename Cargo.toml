[package]
name = "noesora"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for Noesora local vault."
repository = "https://github.com/Noesora/noesora-cli"
readme = "README.md"

[[bin]]
name = "noesora"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
noesora-engine = { path = "../noesora-engine" }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
serde_json = "1"
