[package]
name = "noesora"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CLI for Noesora local vault."
repository = "https://github.com/Noesora/noesora-cli"
readme = "README.md"

[[bin]]
name = "noesora"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
noesora-engine = { path = "../noesora-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
